<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Tools Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
    color:#fff;
    font-family:"Segoe UI",Arial,sans-serif;
    min-height:100vh;
    padding:30px;
}

.container{
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:20px;
    font-size:36px;
}

.refresh-area{
    text-align:center;
    margin-bottom:25px;
}

#refreshBtn{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 24px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    transition:0.2s;
}

#refreshBtn:hover{
    background:#3b82f6;
}

#refreshBtn:disabled{
    opacity:0.7;
    cursor:wait;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.card{
    background:#1e293b;
    border-radius:16px;
    padding:25px;
    border:1px solid #334155;
    cursor:pointer;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#3b82f6;
}

.tool-name{
    font-size:24px;
    margin-bottom:15px;
}

.count{
    font-size:48px;
    font-weight:bold;
    color:#60a5fa;
}

.label{
    margin-top:10px;
    color:#94a3b8;
}

.footer{
    text-align:center;
    margin-top:30px;
    color:#94a3b8;
    line-height:1.8;
}

.status{
    margin-top:10px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>📊 GitHub Tools Dashboard</h1>

<div class="refresh-area">
    <button id="refreshBtn" onclick="loadStats()">
        🔄 刷新数据
    </button>
</div>

<div class="cards">

    <div class="card"
         onclick="window.open('https://acceleratoryzl.github.io/Tools/ConfigFixer','_blank')">

        <div class="tool-name">ConfigFixer</div>

        <div id="configfixer" class="count">
            ...
        </div>

        <div class="label">
            总访问量
        </div>

    </div>

    <div class="card"
         onclick="window.open('https://acceleratoryzl.github.io/Tools/Localizer','_blank')">

        <div class="tool-name">Localizer</div>

        <div id="localizer" class="count">
            ...
        </div>

        <div class="label">
            总访问量
        </div>

    </div>

</div>

<div class="footer">

    <div>
        自动刷新：60秒
    </div>

    <div id="lastUpdate" class="status">
        最后更新：--
    </div>

</div>

</div>

<script>

async function loadStats(){

    const btn = document.getElementById("refreshBtn");

    try{

        btn.disabled = true;
        btn.innerText = "⏳ 刷新中...";

        const configFixerData = await fetch(
            "https://api.countapi.xyz/get/acceleratoryzl/configfixer?t=" + Date.now()
        ).then(r=>r.json());

        const localizerData = await fetch(
            "https://api.countapi.xyz/get/acceleratoryzl/localizer?t=" + Date.now()
        ).then(r=>r.json());

        document.getElementById("configfixer").innerText =
            Number(configFixerData.value).toLocaleString();

        document.getElementById("localizer").innerText =
            Number(localizerData.value).toLocaleString();

        document.getElementById("lastUpdate").innerText =
            "最后更新：" + new Date().toLocaleString();

    }
    catch(error){

        console.error(error);

        document.getElementById("configfixer").innerText = "Error";
        document.getElementById("localizer").innerText = "Error";

        document.getElementById("lastUpdate").innerText =
            "更新失败";

    }
    finally{

        btn.disabled = false;
        btn.innerText = "🔄 刷新数据";

    }

}

loadStats();

setInterval(loadStats,60000);

</script>

</body>
</html>
